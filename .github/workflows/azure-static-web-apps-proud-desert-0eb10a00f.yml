name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate frontend configuration
        run: |
          if [ -z "${NEXT_PUBLIC_AGENT_WEB_URL}" ]; then
            echo "NEXT_PUBLIC_AGENT_WEB_URL is not set"
            exit 1
          fi
          if [ -z "${NEXT_PUBLIC_AZURE_TENANT_ID}" ]; then
            echo "NEXT_PUBLIC_AZURE_TENANT_ID is not set"
            exit 1
          fi
          if [ -z "${NEXT_PUBLIC_AZURE_CLIENT_ID}" ]; then
            echo "NEXT_PUBLIC_AZURE_CLIENT_ID is not set"
            exit 1
          fi
          if [ -z "${NEXT_PUBLIC_AZURE_API_SCOPE}" ]; then
            echo "NEXT_PUBLIC_AZURE_API_SCOPE is not set"
            exit 1
          fi
          echo "NEXT_PUBLIC_AGENT_WEB_URL=${NEXT_PUBLIC_AGENT_WEB_URL}"
          echo "NEXT_PUBLIC_AZURE_TENANT_ID=${NEXT_PUBLIC_AZURE_TENANT_ID}"
          echo "NEXT_PUBLIC_AZURE_CLIENT_ID=${NEXT_PUBLIC_AZURE_CLIENT_ID}"
          echo "NEXT_PUBLIC_AZURE_API_SCOPE=${NEXT_PUBLIC_AZURE_API_SCOPE}"
        env:
          NEXT_PUBLIC_AGENT_WEB_URL: ${{ vars.NEXT_PUBLIC_AGENT_WEB_URL }}
          NEXT_PUBLIC_AZURE_TENANT_ID: ${{ vars.NEXT_PUBLIC_AZURE_TENANT_ID }}
          NEXT_PUBLIC_AZURE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_AZURE_CLIENT_ID }}
          NEXT_PUBLIC_AZURE_API_SCOPE: ${{ vars.NEXT_PUBLIC_AZURE_API_SCOPE }}
      - name: Build azure-agent-ui
        run: pnpm --dir apps/azure-agent-ui build
        env:
          NEXT_PUBLIC_AGENT_WEB_URL: ${{ vars.NEXT_PUBLIC_AGENT_WEB_URL }}
          NEXT_PUBLIC_AZURE_TENANT_ID: ${{ vars.NEXT_PUBLIC_AZURE_TENANT_ID }}
          NEXT_PUBLIC_AZURE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_AZURE_CLIENT_ID }}
          NEXT_PUBLIC_AZURE_API_SCOPE: ${{ vars.NEXT_PUBLIC_AZURE_API_SCOPE }}
          IS_STATIC_EXPORT: true
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          skip_app_build: true
          app_location: "apps/azure-agent-ui/out" # Built app content path when skip_app_build is true
          api_location: "" # Api source code path - optional
          output_location: "" # Leave empty when skip_app_build is true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
          app_location: "apps/azure-agent-ui/out"

version: '3.8'

services:
  api:
    build:
      context: ../..
      dockerfile: environments/deploy/Dockerfile
    container_name: azure-agent-api
    restart: unless-stopped
    ports:
      - "8001:8080"
    environment:
      KEY_VAULT_URL: ${KEY_VAULT_URL}
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "8080"
      WEB_CONCURRENCY: "4"
      WORKER_TIMEOUT: "120"
      GRACEFUL_TIMEOUT: "30"
      KEEP_ALIVE: "75"
    volumes:
      - ./logs:/app/logs
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/agent/api/ping', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    build:
      context: ../..
      dockerfile: environments/deploy/Dockerfile
    container_name: azure-agent-worker
    restart: unless-stopped
    command: ["sh", "-lc", "uv run azure-agent-worker"]
    environment:
      KEY_VAULT_URL: ${KEY_VAULT_URL}
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./logs:/app/logs
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "tr '\\000' ' ' </proc/1/cmdline | grep -q 'azure-agent-worker'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: azure-agent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network
    command: redis-server --appendonly yes --requirepass ${REDIS_ACCESS_KEY}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_ACCESS_KEY} ping | grep PONG"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
